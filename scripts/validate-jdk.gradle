// Helper task to show JDK information
tasks.register('jdkInfo') {
    group = 'help'
    description = 'Shows detailed JDK information'
    
    doLast {
        println "📋 JDK Information:"
        println "   Java Home: ${System.getProperty('java.home')}"
        println "   Java Version: ${JavaVersion.current()}"
        println "   JAVA_HOME env: ${System.getenv('JAVA_HOME') ?: 'Not set'}"
        println "   JDK17_HOME env: ${System.getenv('JDK17_HOME') ?: 'Not set'}"
        println "   gradle.java.home property: ${project.findProperty('org.gradle.java.home') ?: 'Not set'}"
    }
}
