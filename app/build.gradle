// ✅ CORRECT ORDER: plugins block FIRST
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // ✅ APPLY THE KSP PLUGIN
    id 'com.google.devtools.ksp'
    // ✅ APPLY PARCELIZE PLUGIN
    id 'kotlin-parcelize'
}

// Load keystore properties from keystore.properties file
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ✅ Then android block
android {
    namespace 'com.notificationlog'  // your actual package name
    compileSdk 36

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.notificationlog"
        minSdk 24  // adjust as needed
        targetSdk 36
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // other android configs...
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    // ✅ Enable DataBinding
    buildFeatures {
        dataBinding true
    }

    // ✅ This block should now be recognized correctly
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

// ✅ Then dependencies block
dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ✅ Room Database (for storing notifications)
    def roomVersion = "2.8.5"

    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // ✅ ViewModel + Lifecycle (for viewModelScope)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    // 1.9+ for ComponentActivity.enableEdgeToEdge()
    implementation 'androidx.activity:activity-ktx:1.10.1'
}

// ... rest of the file
