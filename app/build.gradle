apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
	compileSdk 33

	namespace "com.notificationlog"

	defaultConfig {
		applicationId "com.notificationlog"
		minSdk 21
		targetSdk 33
		versionCode 1
		versionName "1.0"
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	kotlinOptions {
		jvmTarget = "17"
	}
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.6.1'
	// Other dependencies
}