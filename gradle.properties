# Project Gradle Properties
# ========================

# Android configuration
android.useAndroidX=true
kotlin.code.style=official

# Keep builds byte-for-byte reproducible: AGP otherwise writes a
# per-build DependencyInfoBlock into the APK signing block, which
# differs between builds of identical source.
android.includeDependencyInfoInApks=false

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# JVM settings for Gradle
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

ksp.incremental=false
ksp.verbose=true
