# Project Gradle Properties
# ========================

# Android configuration
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# JDK Configuration
# ----------------
# Set this to your JDK 21 installation path
# Example (Windows): org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
# Example (Mac/Linux): org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
# Using Eclipse Adoptium JDK 21
org.gradle.java.home=C\:/Program Files/Eclipse Adoptium/jdk-21.0.9.10-hotspot

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# JVM settings for Gradle
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Verification and Troubleshooting
# --------------------------------
# 1. First, set your JDK 21 path above
# 2. Verify setup by running: ./gradlew validateJdk
#    Should show: "✅ SUCCESS: JDK 21 detected correctly"
#
# COMMON ERRORS:
# --------------
# Error: "Unsupported class file major version"
# Cause: Using an older JDK (like 17) instead of JDK 21
# Fix: Set org.gradle.java.home above to JDK 21 path

ksp.incremental=false
ksp.verbose=true