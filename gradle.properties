# Project Gradle Properties
# ========================

# Android configuration
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# JDK Configuration
# ----------------
# Set this to your JDK 21 installation path
# Example (Windows): org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
# Example (Mac/Linux): org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
# Using Android Studio's JBR (JetBrains Runtime) which is JDK 21
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# JVM settings for Gradle
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Verification and Troubleshooting
# --------------------------------
# 1. First, set your JDK 17 path above
# 2. Verify setup by running: ./gradlew validateJdk
#    Should show: "✅ SUCCESS: JDK 17 detected correctly"
#
# COMMON ERRORS:
# --------------
# Error: "Unsupported class file major version 69"
# Cause: Using JDK 21+ instead of JDK 17
# Fix: Set org.gradle.java.home above to JDK 17 path
#
# Error: "Unsupported class file major version 68"
# Cause: Using JDK 20 instead of JDK 17
# Fix: Set org.gradle.java.home above to JDK 17 path
#
# Error: "Unsupported class file major version 67"
# Cause: Using JDK 19 instead of JDK 17
# Fix: Set org.gradle.java.home above to JDK 17 path
ksp.incremental=false
ksp.verbose=true